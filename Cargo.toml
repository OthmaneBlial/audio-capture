[package]
name = "voice-transcriber"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
description = "Review-first cross-platform dictation desk with an explicit provider boundary."
license = "MIT"
readme = "README.md"
repository = "https://github.com/OthmaneBlial/audio-capture"
homepage = "https://othmaneblial.github.io/audio-capture/"
keywords = ["dictation", "transcription", "audio", "desktop", "privacy"]
categories = ["multimedia::audio", "accessibility", "gui"]

[dependencies]
cpal = "0.18.2"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
webrtc-vad = "0.4.0"

[dev-dependencies]
assert_matches = "1.5.0"

[[bin]]
name = "voice-transcriber"
path = "src/main.rs"
