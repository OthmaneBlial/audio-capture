name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "src/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "src/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  quality:
    name: Rust format, tests, and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux audio and windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit Rust dependency graph
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check advisories licenses bans sources

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: voice-transcriber
          - os: macos-14
            target: aarch64-apple-darwin
            binary: voice-transcriber
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: voice-transcriber.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
        shell: bash
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-transcriber-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
