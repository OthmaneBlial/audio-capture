name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verification tools
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check .
      - name: Compile source
        run: python -m compileall -q audio transcription ui config.py main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
