name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install verification tools
        run: python -m pip install --upgrade pip -r requirements-test.txt
      - name: Run source checks
        run: python scripts/run_checks.py
      - name: Write coverage XML
        if: matrix.python-version == '3.11'
        run: coverage xml --omit='tests/*,scripts/*' -o coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python-version == '3.11'
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.11'
        run: python -m build

  dependency-and-static-security:
    name: Dependency audit and Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security tools
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Audit exact Flatpak Python dependencies
        run: pip-audit --require-hashes --disable-pip -r packaging/requirements-audit.txt
      - name: Run static security analysis
        run: >-
          bandit -q -ll -r audio transcription ui benchmarks
          config.py diagnostics.py exports.py history.py main.py onboarding.py
          platform_capabilities.py transcript.py
