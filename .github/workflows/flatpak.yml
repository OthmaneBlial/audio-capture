name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audio/**"
      - "transcription/**"
      - "ui/**"
      - "config.py"
      - "diagnostics.py"
      - "onboarding.py"
      - "main.py"
      - "exports.py"
      - "history.py"
      - "transcript.py"
      - "platform_capabilities.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - "packaging/**"
      - "resources/**"
      - "pyproject.toml"
      - "io.github.othmaneblial.audio_capture.yml"
      - ".github/workflows/flatpak.yml"
  pull_request:
    branches: [main]
    paths:
      - "audio/**"
      - "transcription/**"
      - "ui/**"
      - "config.py"
      - "diagnostics.py"
      - "onboarding.py"
      - "main.py"
      - "exports.py"
      - "history.py"
      - "transcript.py"
      - "platform_capabilities.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - "packaging/**"
      - "resources/**"
      - "pyproject.toml"
      - "io.github.othmaneblial.audio_capture.yml"
      - ".github/workflows/flatpak.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1b74b57fa75e61b217e90072aec7ba7d618613fea982106cb3e813c002662162 # gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.othmaneblial.audio_capture.desktop
          appstreamcli validate --no-net --explain packaging/io.github.othmaneblial.audio_capture.metainfo.xml
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            manifest io.github.othmaneblial.audio_capture.yml
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            appstream packaging/io.github.othmaneblial.audio_capture.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: voice-transcriber.flatpak
          manifest-path: io.github.othmaneblial.audio_capture.yml
          cache-key: flatpak-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('io.github.othmaneblial.audio_capture.yml', 'packaging/python3-dependencies.json') }}
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Prove a no-download rebuild
        run: |
          source_dir="$RUNNER_TEMP/voice-transcriber-source"
          mkdir -p "$source_dir"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar HEAD | tar -xf - -C "$source_dir"
          flatpak-builder --force-clean --disable-download --disable-rofiles-fuse \
            --state-dir="$GITHUB_WORKSPACE/.flatpak-builder" \
            "$RUNNER_TEMP/offline-build" \
            "$source_dir/io.github.othmaneblial.audio_capture.yml"
      - name: Lint the mirrored exported repository
        run: |
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            repo repo
      - name: Initialize D-Bus machine identity
        run: dbus-uuidgen --ensure=/etc/machine-id
      - name: Smoke test installed bundle
        run: packaging/smoke_test_flatpak.sh voice-transcriber.flatpak 1.0.0
