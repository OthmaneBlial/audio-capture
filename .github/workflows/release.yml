name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  quality:
    name: Release source quality and security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pure verification and security tools
        run: python -m pip install --upgrade pip -r requirements-test.txt pip-audit bandit
      - name: Lint and compile source
        run: |
          ruff check .
          python -m compileall -q audio transcription ui benchmarks scripts config.py diagnostics.py exports.py history.py main.py onboarding.py platform_capabilities.py transcript.py
      - name: Run tests and core coverage
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --omit='tests/*,scripts/*,ui/*,audio/__init__.py' --show-missing --fail-under=65
      - name: Audit dependencies and Python security
        run: |
          pip-audit --require-hashes --disable-pip -r packaging/requirements-audit.txt
          bandit -q -ll -r audio transcription ui benchmarks config.py diagnostics.py exports.py history.py main.py onboarding.py platform_capabilities.py transcript.py

  build-and-attest:
    name: Build, verify, and attest Flatpak
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Establish exact release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.othmaneblial.audio_capture.desktop
          appstreamcli validate --no-net --explain packaging/io.github.othmaneblial.audio_capture.metainfo.xml
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            manifest io.github.othmaneblial.audio_capture.yml
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            appstream packaging/io.github.othmaneblial.audio_capture.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          bundle: voice-transcriber.flatpak
          manifest-path: io.github.othmaneblial.audio_capture.yml
          cache-key: release-flatpak-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('io.github.othmaneblial.audio_capture.yml', 'packaging/python3-dependencies.json') }}
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Prove a no-download rebuild
        run: |
          source_dir="$RUNNER_TEMP/voice-transcriber-source"
          mkdir -p "$source_dir"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar HEAD | tar -xf - -C "$source_dir"
          flatpak-builder --force-clean --disable-download --disable-rofiles-fuse \
            --state-dir="$GITHUB_WORKSPACE/.flatpak-builder" \
            "$RUNNER_TEMP/offline-build" \
            "$source_dir/io.github.othmaneblial.audio_capture.yml"
      - name: Lint the mirrored exported repository
        run: |
          flatpak-builder-lint --exceptions \
            --user-exceptions packaging/flatpak-lint-exceptions.json \
            repo repo
      - name: Smoke test installed bundle
        run: packaging/smoke_test_flatpak.sh voice-transcriber.flatpak
      - name: Generate checksum, SBOM, test report, and notes
        run: |
          mkdir -p release
          mv voice-transcriber.flatpak "release/voice-transcriber-$VERSION-x86_64.flatpak"
          cd release
          sha256sum "voice-transcriber-$VERSION-x86_64.flatpak" > "voice-transcriber-$VERSION-x86_64.flatpak.sha256"
          cd ..
          commit_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 scripts/generate_sbom.py \
            --version "$VERSION" --commit "$GITHUB_SHA" --timestamp "$commit_time" \
            --output "release/voice-transcriber-$VERSION.cdx.json"
          python3 scripts/run_release_tests.py \
            --version "$VERSION" --commit "$GITHUB_SHA" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --flatpak-status passed \
            --output "release/voice-transcriber-$VERSION-test-report.json"
          python3 scripts/render_release_notes.py \
            --version "$VERSION" --commit "$GITHUB_SHA" --output release/release-notes.md
      - name: Generate build provenance attestation
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: release/voice-transcriber-${{ env.VERSION }}-x86_64.flatpak
      - name: Generate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: release/voice-transcriber-${{ env.VERSION }}-x86_64.flatpak
          sbom-path: release/voice-transcriber-${{ env.VERSION }}.cdx.json
      - name: Add downloadable attestation bundles
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "release/voice-transcriber-$VERSION-provenance.sigstore.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" "release/voice-transcriber-$VERSION-sbom-attestation.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-transcriber-${{ github.ref_name }}-release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish immutable-shaped release assets
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Establish release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          name: voice-transcriber-${{ github.ref_name }}-release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/voice-transcriber-$version-x86_64.flatpak" \
            "release/voice-transcriber-$version-x86_64.flatpak.sha256" \
            "release/voice-transcriber-$version.cdx.json" \
            "release/voice-transcriber-$version-test-report.json" \
            "release/voice-transcriber-$version-provenance.sigstore.json" \
            "release/voice-transcriber-$version-sbom-attestation.sigstore.json" \
            --verify-tag \
            --title "Voice Transcriber $GITHUB_REF_NAME" \
            --notes-file release/release-notes.md
