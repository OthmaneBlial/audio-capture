name: Rust release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  quality:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux audio and windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
      - name: Check format, tests, and lints
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check advisories licenses bans sources

  build:
    name: Package ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: voice-transcriber
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: voice-transcriber
            archive: app.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: voice-transcriber.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libegl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"
        shell: bash
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
        shell: bash
      - name: Package Linux archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="voice-transcriber-${version}-${{ matrix.target }}"
          mkdir -p "$root"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$root/"
          cp README.md LICENSE "$root/"
          tar -czf "${root}.tar.gz" "$root"
          shasum -a 256 "${root}.tar.gz" > "${root}.tar.gz.sha256"
      - name: Package macOS application archive
        if: matrix.archive == 'app.zip'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="voice-transcriber-${version}-${{ matrix.target }}"
          app="$root/Voice Transcriber.app"
          mkdir -p "$app/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$app/Contents/MacOS/voice-transcriber"
          chmod +x "$app/Contents/MacOS/voice-transcriber"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>Voice Transcriber</string>
          <key>CFBundleExecutable</key><string>voice-transcriber</string>
          <key>CFBundleIdentifier</key><string>io.github.othmaneblial.audio_capture</string>
          <key>CFBundleName</key><string>Voice Transcriber</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${version}</string>
          <key>CFBundleVersion</key><string>${version}</string>
          <key>NSMicrophoneUsageDescription</key><string>Voice Transcriber needs microphone access to capture speech for review.</string>
          </dict></plist>
          PLIST
          cp README.md LICENSE "$root/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${root}.app.zip"
          shasum -a 256 "${root}.app.zip" > "${root}.app.zip.sha256"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $root = "voice-transcriber-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $root
          Copy-Item README.md, LICENSE $root
          Compress-Archive -Path $root -DestinationPath "$root.zip"
          $checksum = (Get-FileHash "$root.zip" -Algorithm SHA256).Hash.ToLower() + "  $root.zip"
          [System.IO.File]::WriteAllText("$root.zip.sha256", $checksum, [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-transcriber-${{ matrix.target }}-release
          path: |
            voice-transcriber-*.tar.gz
            voice-transcriber-*.app.zip
            voice-transcriber-*.zip
            voice-transcriber-*.sha256
          if-no-files-found: error

  publish:
    name: Publish native release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: voice-transcriber-*-release
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Voice Transcriber $GITHUB_REF_NAME" \
            --generate-notes
